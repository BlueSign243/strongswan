# Standalone moon/sun laboratory configuration; M1.
# Stop old connections/traps with overlapping traffic selectors first.
connections {
    host-host-aigissig {
        version = 2
        local_addrs = 192.168.199.130
        remote_addrs = 192.168.199.131
        proposals = aes256gcm16-prfsha384-ecp256-ke1_aigisenc2sm3
        fragmentation = yes
        send_cert = always
        mobike = no
        reauth_time = 3h
        rekey_time = 1h
        local {
            auth = ike:aigissig2ed25519-sha512
            certs = sunM1CompositeCert.pem
            id = sun.strongswan.org
        }
        remote {
            auth = ike:aigissig2ed25519-sha512
            cacerts = aigisClassicalCaCert.pem
            id = moon.strongswan.org
        }
        children {
            host-host-aigissig {
                local_ts = 192.168.199.130/32
                remote_ts = 192.168.199.131/32
                esp_proposals = aes256gcm16-ecp256-ke1_aigisenc2sm3
                mode = tunnel
                start_action = none
                rekey_time = 45m
            }
        }
    }
}
